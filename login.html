<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Chatbot</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="login-container">

        <div class="logo">
            <div class="logo-icon">✦</div>
            <span>Remnexa <span class="ai-text">AI</span></span>
        </div>

        <div class="welcome-text">
            <p class="welcome-label">YOUR AI COMPANION</p>

            <h1>Welcome back<span class="purple-dot">.</span></h1>

            <p class="subtitle">
                Your ideas deserve a conversation.
                Sign in and let's get started.
            </p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email address</label>

                <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"
                    required>
            </div>

            <button type="submit" id="loginButton">
                <span>Sign In</span>
                <span class="button-arrow">→</span>
            </button>

        </form>

        <p id="message"></p>

        <p>
            New user?
            <a href="register.html">Create an account</a>
        </p>


        <p id="message" role="status" aria-live="polite"></p>

        <div class="divider">
            <span></span>
            <p>YOUR SPACE FOR IDEAS</p>
            <span></span>
        </div>

        <p class="footer-text">
            Powered by <strong>AI</strong> · Built for curious minds
        </p>

    </main>

    <script src="login.js"></script>

</body>

</html>
